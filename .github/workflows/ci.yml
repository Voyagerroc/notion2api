name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with Ruff
        run: |
          ruff check tests/

      - name: Run Pytest
        env:
          # A synthetic account pool so `app` startup does not depend on a real
          # Notion session. The suite mocks every upstream call.
          NOTION_ACCOUNTS: '[{"profile_name":"default","token_v2":"synthetic","space_id":"00000000000000000000000000000000","user_id":"00000000-0000-0000-0000-000000000000","space_view_id":"00000000-0000-0000-0000-000000000000","user_name":"tester","user_email":"tester@example.invalid"}]'
        run: |
          pytest tests/ -v
