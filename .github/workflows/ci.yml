name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Offline tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      UV_PYTHON: ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.12.5
      - run: uv sync --locked --extra dev
      - run: uv run --locked --extra dev ruff check .
      - run: uv build --wheel
      - name: Offline regression suite and wheel contents
        shell: python
        run: |
          import os, pathlib, subprocess
          env = dict(os.environ, NOTION2API_TEST_WHEEL=str(next(pathlib.Path('dist').glob('*.whl')).resolve()))
          subprocess.run(['uv', 'run', '--locked', '--extra', 'dev', 'pytest', 'tests/', '-q'], env=env, check=True)
      - run: uv run --locked --extra dev python scripts/check_distribution.py
